<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>酌有韶</title>
<meta name="theme-color" content="#F6EBE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1315" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="酌有韶">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
(function(){var r=document.documentElement,m='day';try{m=localStorage.getItem('yousao.mode')||'day'}catch(e){}
if(m!=='night'&&m!=='both')m='day';r.dataset.realm=m;if(m==='day')r.dataset.theme='light'})();
</script>
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--sticky-top:0px}
@font-face{font-family:"Yousao Hand";src:url("fonts/yousao-hand.woff") format("woff");font-weight:100 900;font-style:normal;font-display:swap}
/* Layout: sticky top bar with one menu icon (left) that slides a drawer in; four views (projects, today, week, month);
   day / task / project forms open as a bottom sheet on phones and a centred card on wide screens.
   Palette: dried rose. Dusty rose accent over wine-brown ink; each project status keeps its own muted hue. */
:root {
  --font-body: "Yousao Hand", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-display: var(--font-body);

  --bg: #F6EBE8;
  --surface: #FCF6F3;
  --surface-2: #F1E1DD;
  --line: #E4CFCB;
  --fg: #4A2F34;
  --fg-soft: #86666C;
  --accent: #A8575F;
  --on-accent: #FFF7F5;
  --accent-soft: #EBCBCB;
  --accent-ink: #7A3340;
  --scrim: rgba(60, 28, 34, .42);
  --shadow: 0 1px 2px rgba(110, 47, 59, .06), 0 6px 18px rgba(110, 47, 59, .07);

  --rose-3: #DDAEB1;
  --rose-2: #C2808A;
  --rose-1: #A04F5C;
  --rose-edge: #6E2F3B;

  --st-doing-bg: #F2CDCB;  --st-doing-fg: #8A3B45;
  --st-todo-bg: #F1DFC4;   --st-todo-fg: #7A5524;
  --st-paused-bg: #E4DADF; --st-paused-fg: #6B5A62;
  --st-chore-bg: #D9E3D2;  --st-chore-fg: #4B6244;
  --st-new-bg: #E5D6EA;    --st-new-fg: #66487A;
  --warn-bg: #F1DFC4;      --warn-fg: #7A5524;

  --day-c: #B0606B;   --day-bg: #F2D3D3;   --day-fg: #8A3B45;
  --night-c: #5468B8; --night-bg: #D6DCF3; --night-fg: #37468A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1315; --surface: #271A1D; --surface-2: #332326; --line: #432E33;
    --fg: #F3E3E0; --fg-soft: #B79AA0; --accent: #D8A0A5; --on-accent: #2A1519;
    --accent-soft: #4A2E34; --accent-ink: #F0BFC3; --scrim: rgba(8, 3, 4, .62); --shadow: none;
    --rose-3: #E8B9BB; --rose-2: #D18F96; --rose-1: #B5646F; --rose-edge: #2E171C;
    --st-doing-bg: #4F2C33;  --st-doing-fg: #F0B6BB;
    --st-todo-bg: #4A3A22;   --st-todo-fg: #E8C894;
    --st-paused-bg: #3A3035; --st-paused-fg: #BBA8B0;
    --st-chore-bg: #2E3D2B;  --st-chore-fg: #B5CDA9;
    --st-new-bg: #3D2F47;    --st-new-fg: #D3BCE0;
    --warn-bg: #4A3A22;      --warn-fg: #E8C894;
    --day-c: #D8A0A5;   --day-bg: #4F2C33;   --day-fg: #F0B6BB;
    --night-c: #8EA2F0; --night-bg: #2B3560; --night-fg: #BDC9FA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1315; --surface: #271A1D; --surface-2: #332326; --line: #432E33;
  --fg: #F3E3E0; --fg-soft: #B79AA0; --accent: #D8A0A5; --on-accent: #2A1519;
  --accent-soft: #4A2E34; --accent-ink: #F0BFC3; --scrim: rgba(8, 3, 4, .62); --shadow: none;
  --rose-3: #E8B9BB; --rose-2: #D18F96; --rose-1: #B5646F; --rose-edge: #2E171C;
  --st-doing-bg: #4F2C33;  --st-doing-fg: #F0B6BB;
  --st-todo-bg: #4A3A22;   --st-todo-fg: #E8C894;
  --st-paused-bg: #3A3035; --st-paused-fg: #BBA8B0;
  --st-chore-bg: #2E3D2B;  --st-chore-fg: #B5CDA9;
  --st-new-bg: #3D2F47;    --st-new-fg: #D3BCE0;
  --warn-bg: #4A3A22;      --warn-fg: #E8C894;
  --day-c: #D8A0A5;   --day-bg: #4F2C33;   --day-fg: #F0B6BB;
  --night-c: #8EA2F0; --night-bg: #2B3560; --night-fg: #BDC9FA;
  color-scheme: dark;
}

/* 暮：整頁換成靛藍（放在深色規則後面，所以不管系統是亮是暗都以它為準） */
:root[data-realm="night"] {
  --bg: #141A33; --surface: #1B2344; --surface-2: #252F58; --line: #34406F;
  --fg: #E8ECFC; --fg-soft: #A0ACD6; --accent: #97ABF2; --on-accent: #10173A;
  --accent-soft: #2D3A72; --accent-ink: #C6D2FF; --scrim: rgba(5, 8, 22, .66); --shadow: none;
  --rose-3: #EBC1D2; --rose-2: #D296B1; --rose-1: #B06B8A; --rose-edge: #10163A;
  --st-doing-bg: #33407F;  --st-doing-fg: #C7D3FF;
  --st-todo-bg: #4A3F2A;   --st-todo-fg: #EBD39A;
  --st-paused-bg: #2F3556; --st-paused-fg: #A9B2D6;
  --st-chore-bg: #244A4A;  --st-chore-fg: #A6DCCF;
  --st-new-bg: #4A2E5E;    --st-new-fg: #E3C2F0;
  --warn-bg: #4A3F2A;      --warn-fg: #EBD39A;
  --day-c: #E0A6BE;   --day-bg: #4A2D4F;   --day-fg: #F3C2D8;
  --night-c: #97ABF2; --night-bg: #33407F; --night-fg: #C9D3FF;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.65;
  font-weight: 400;
  font-synthesis-weight: none;
  -webkit-text-stroke: .35px currentColor;
  -webkit-tap-highlight-color: transparent;
}
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: var(--sticky-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: calc(var(--safe-top, 0px) + 10px) 16px 10px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.top-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.seg button { flex: 1; min-width: 0; min-height: 38px; padding: 0 10px; border: 0; border-radius: 999px; background: transparent; color: var(--fg-soft); font-size: 21px; letter-spacing: .12em; text-indent: .12em; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }
.seg button[aria-checked="true"][data-m="both"] { background: linear-gradient(100deg, #A8575F, #4D61B5); color: #FFFFFF; }
.topbar .seg { flex: 1; max-width: 320px; margin: 0 auto; }
.seg.small { max-width: 220px; }
.seg.small button { min-height: 36px; font-size: 19px; }
.icon-btn {
  width: 46px; height: 46px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface);
  color: var(--accent-ink); display: grid; place-items: center; flex: none;
}
.icon-btn:hover { border-color: var(--accent); }
.text-btn { height: 46px; padding: 0 18px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface); color: var(--accent-ink); }
.text-btn:hover { border-color: var(--accent); }

.main { max-width: 1040px; margin: 0 auto; padding: 20px 16px calc(48px + var(--safe-bottom, 0px)); outline: none; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; width: min(86vw, 330px);
  display: flex; flex-direction: column; gap: 14px;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: calc(var(--safe-top, 0px) + 14px) 14px calc(var(--safe-bottom, 0px) + 16px);
  transform: translateX(-104%); transition: transform .24s ease, visibility 0s linear .24s; overflow-y: auto; visibility: hidden;
}
.drawer.open { transform: none; visibility: visible; transition: transform .24s ease, visibility 0s; box-shadow: 8px 0 30px rgba(40, 14, 20, .18); }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 2px 4px 8px; }
.drawer-head .logo { width: 40px; height: 40px; flex: none; }
.drawer-name { flex: 1; font-size: 26px; letter-spacing: .16em; }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.nav button {
  width: 100%; min-height: 56px; display: flex; align-items: center; gap: 14px; padding: 8px 16px;
  border: 1px solid transparent; border-radius: 16px; background: transparent; text-align: left; font-size: 20px;
}
.nav button:hover { background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.nav .nav-group { padding: 12px 16px 2px; font-size: 14px; letter-spacing: .24em; color: var(--fg-soft); }
.nav .badge { margin-left: auto; min-width: 26px; padding: 0 8px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 14px; line-height: 1.7; text-align: center; }
.drawer-sec { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; font-size: 16px; color: var(--fg-soft); }
.drawer-sec .row-pick { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.drawer-sec select { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.drawer-link { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 16px; border: 1px solid transparent; border-radius: 14px; background: transparent; text-align: left; font-size: 18px; color: var(--fg); width: 100%; }
.drawer-link:hover { background: var(--surface-2); }
.drawer details { font-size: 15.5px; }
.drawer summary { cursor: pointer; padding: 6px 4px; }
.drawer details p { margin: 6px 4px 0; line-height: 1.7; }
.mode-note { margin: 0; font-size: 15px; }
.credit { margin: 0; font-size: 13.5px; opacity: .85; }

/* ---------- shared bits ---------- */
.btn { padding: 8px 22px; min-height: 46px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.soft { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.btn.armed { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { min-height: 38px; padding: 4px 16px; font-size: 16px; }
.vhead { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.vhead .range { flex: 1; min-width: 0; text-align: center; font-size: 24px; letter-spacing: .06em; }
.vhead .range small { display: block; font-size: 15px; color: var(--fg-soft); letter-spacing: 0; line-height: 1.3; }
.pill { position: relative; display: inline-flex; border-radius: 999px; background: var(--pill-bg); color: var(--pill-fg); }
.pill select {
  appearance: none; -webkit-appearance: none; font-size: 16px; color: inherit;
  background: transparent; border: 0; padding: 5px 32px 5px 14px; border-radius: 999px; cursor: pointer;
}
.pill select option { color: var(--fg); background: var(--surface); }
.pill::after {
  content: ""; position: absolute; right: 14px; top: 50%; width: 5px; height: 5px;
  border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor;
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}
.pill.static { padding: 3px 14px; font-size: 15.5px; }
.st-doing  { --pill-bg: var(--st-doing-bg);  --pill-fg: var(--st-doing-fg); }
.st-todo   { --pill-bg: var(--st-todo-bg);   --pill-fg: var(--st-todo-fg); }
.st-paused { --pill-bg: var(--st-paused-bg); --pill-fg: var(--st-paused-fg); }
.st-chore  { --pill-bg: var(--st-chore-bg);  --pill-fg: var(--st-chore-fg); }
.st-new    { --pill-bg: var(--st-new-bg);    --pill-fg: var(--st-new-fg); }
.tag { display: inline-block; padding: 0 10px; border-radius: 999px; background: var(--surface-2); color: var(--fg-soft); font-size: 14px; line-height: 1.6; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  padding: 40px 20px; border: 1.5px dashed var(--line); border-radius: 20px; color: var(--fg-soft);
}
.empty svg { width: 84px; height: 84px; opacity: .6; }
.empty h3 { margin: 0; font-size: 26px; letter-spacing: .06em; color: var(--fg); font-weight: 400; }
.empty p { margin: 0; font-size: 17.5px; max-width: 28em; text-wrap: balance; }
.sec-title { margin: 22px 0 10px; font-size: 20px; letter-spacing: .08em; color: var(--accent-ink); font-weight: 400; display: flex; align-items: center; gap: 10px; }
.sec-title .grow { flex: 1; }
.card-box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 8px 14px; box-shadow: var(--shadow); }
.card-box.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn-fg); }
.hint { margin: 0; color: var(--fg-soft); font-size: 16px; }

/* ---------- tasks ---------- */
.task { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 0; }
.task + .task { border-top: 1px dashed var(--line); }
.chk {
  position: relative; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--accent); background: transparent;
  color: var(--on-accent); display: grid; place-items: center; flex: none; padding: 0;
}
.chk::after { content: ""; position: absolute; inset: -10px; }
.chk .ic { width: 18px; height: 18px; stroke-width: 2.6; opacity: 0; }
.task.done .chk { background: var(--accent); }
.task.done .chk .ic { opacity: 1; }
.task-body { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; border: 0; background: none; text-align: left; padding: 6px 0; }
.task-title { overflow-wrap: anywhere; }
.task.done .task-title { text-decoration: line-through; color: var(--fg-soft); }
.task-move { font-size: 15px; padding: 2px 12px; border-radius: 999px; border: 1px solid currentColor; background: transparent; flex: none; }
.qadd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.qadd > input { flex: 1 1 150px; min-width: 0; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.qopts { flex: 1 0 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; color: var(--fg-soft); font-size: 15.5px; }
.qopts input[type="date"] { padding: 6px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.chip.small { font-size: 15.5px; padding: 4px 14px; }
.progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* ---------- projects view ---------- */
.masthead { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; margin-bottom: 24px; }
.mast-title { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.mast-title svg { width: 56px; height: 56px; flex: none; }
.mast-name { margin: 0; font-size: clamp(40px, 11vw, 60px); font-weight: 400; letter-spacing: .16em; margin-right: -.16em; line-height: 1.25; }
.mast-sub { margin: 0; color: var(--fg-soft); font-size: 17px; text-wrap: balance; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
@media (min-width: 720px) { .stats { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 6px 12px; text-align: center; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 36px; line-height: 1.1; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 6px; font-size: 16px; color: var(--fg-soft); white-space: nowrap; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
.chip { font-size: 17px; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.bar .add { margin-left: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; box-shadow: var(--shadow); }
.pcard h3 { margin: 0; font-size: 21px; font-weight: 400; line-height: 1.45; overflow-wrap: anywhere; }
.pcard p { margin: 0; font-size: 17.5px; color: var(--fg-soft); white-space: pre-line; overflow-wrap: anywhere; }
.pcard .when { font-size: 16px; color: var(--accent-ink); }
.pfoot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-top: 6px; }
.pfoot .grow { flex: 1; }
.link-btn { border: 0; background: none; color: var(--fg-soft); padding: 6px 10px; border-radius: 8px; font-size: 16px; }
.link-btn:hover { color: var(--accent-ink); background: var(--surface-2); }

/* ---------- today ---------- */
.hero { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
.hero .big { font-size: clamp(38px, 10vw, 54px); letter-spacing: .08em; line-height: 1.2; }
.hero .wd { font-size: 20px; color: var(--fg-soft); letter-spacing: .12em; }
.proj-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border: 0; background: none; width: 100%; text-align: left; }
.proj-row + .proj-row { border-top: 1px dashed var(--line); }
.proj-row .ptitle { flex: 1; min-width: 0; overflow-wrap: anywhere; }

/* ---------- week ---------- */
.main.wide { max-width: 1360px; }
.week { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 720px) { .week { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); align-items: start; } }
@media (min-width: 1240px) {
  .week { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .day { padding: 12px 10px; }
  .day .task-body { font-size: 16.5px; }
  .day .chk { width: 26px; height: 26px; }
  .day .chk .ic { width: 15px; height: 15px; }
  .day .task { gap: 8px; }
  .day-head .num { font-size: 26px; }
}
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; box-shadow: var(--shadow); }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.day.weekend { background: var(--surface-2); }
.day-head { display: flex; align-items: baseline; gap: 8px; }
.day-head .num { font-size: 28px; line-height: 1.1; }
.day-head .wd { font-size: 16px; color: var(--fg-soft); white-space: nowrap; }
.day-head .grow { flex: 1; }
.day-add { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--accent-ink); display: grid; place-items: center; align-self: center; }
.day-add:hover { border-color: var(--accent); }
.mini-proj { display: block; width: 100%; text-align: left; border: 0; padding: 3px 10px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); font-size: 15.5px; line-height: 1.45; overflow-wrap: anywhere; }
.mini-proj em { font-style: normal; opacity: .75; margin-left: 6px; font-size: 14px; }
.day .task { min-height: 44px; }
.day .empty-day { color: var(--fg-soft); font-size: 15px; opacity: .7; }

/* ---------- month ---------- */
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; color: var(--fg-soft); font-size: 16px; margin-bottom: 6px; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cell {
  position: relative; min-width: 0; min-height: 70px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  padding: 6px 4px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--fg);
}
.cell:hover { border-color: var(--accent); }
.cell.out { opacity: .45; }
.cell.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.cell .n { font-size: 18px; line-height: 1.2; }
.cell.today .n { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0 8px; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 100%; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); opacity: .8; }
.dot.p { border-radius: 2px; background: var(--accent); opacity: 1; }
.dot.d { background: var(--fg-soft); opacity: .35; }
.lines { display: none; width: 100%; text-align: left; flex-direction: column; gap: 2px; }
.line { display: block; width: 100%; font-size: 14px; line-height: 1.35; padding: 1px 6px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line.p { background: var(--accent-soft); color: var(--accent-ink); }
.line.t { color: var(--fg); }
.line.t.done { text-decoration: line-through; color: var(--fg-soft); }
.line.more { color: var(--fg-soft); }
@media (min-width: 720px) {
  .cell { min-height: 118px; align-items: stretch; text-align: left; padding: 8px 8px; gap: 6px; }
  .cell .n { align-self: flex-start; }
  .dots { display: none; }
  .lines { display: flex; }
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 15px; color: var(--fg-soft); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 580px; max-height: 90vh; max-height: 90dvh; overflow-y: auto; background: var(--surface);
  border-radius: 24px 24px 0 0; padding: 20px 18px calc(24px + var(--safe-bottom, 0px)); border: 1px solid var(--line); outline: none;
  animation: rise .22s ease;
}
@keyframes rise { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (min-width: 720px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 24px; } }
.sheet h2 { margin: 0 0 14px; font-size: 26px; font-weight: 400; letter-spacing: .08em; }
.sheet h2 small { font-size: 17px; color: var(--fg-soft); margin-left: 10px; letter-spacing: .04em; }
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 15.5px; color: var(--fg-soft); }
.field input, .field textarea, .field select {
  font-size: 17px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0;
}
.field textarea { resize: vertical; min-height: 84px; }
.field.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.field.two > div { display: grid; gap: 6px; min-width: 0; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.actions .grow { flex: 1; }
.toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-bottom, 0px)); transform: translateX(-50%); z-index: 60; margin: 0; max-width: min(92vw, 460px); padding: 10px 20px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 16.5px; text-align: center; }
.backup-box { width: 100%; min-height: 120px; font-size: 14px; font-family: ui-monospace, Menlo, Consolas, monospace; -webkit-text-stroke: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: vertical; }

/* ---------- 朝／暮：色標、星號、畫面標題 ---------- */
.rtag { display: inline-block; flex: none; min-width: 28px; padding: 0 9px; border-radius: 999px; font-size: 15px; line-height: 1.55; text-align: center; white-space: nowrap; }
.rtag.day { background: var(--day-bg); color: var(--day-fg); }
.rtag.night { background: var(--night-bg); color: var(--night-fg); }
.rtag.mini { min-width: 24px; padding: 0 6px; font-size: 14px; }
button.realm-toggle { min-height: 46px; padding: 0 16px; font-size: 16px; border: 1px solid transparent; border-radius: 14px; }
button.realm-toggle:hover { border-color: currentColor; }
.view-head { margin-bottom: 18px; }
.view-head h2 { margin: 0; font-size: clamp(32px, 9vw, 42px); font-weight: 400; letter-spacing: .1em; line-height: 1.3; }
.view-head p { margin: 2px 0 0; color: var(--fg-soft); font-size: 17px; text-wrap: balance; }
.star { width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--fg-soft); display: grid; place-items: center; flex: none; opacity: .7; }
.star:hover { opacity: 1; }
.star .ic { width: 22px; height: 22px; }
.star.on { color: var(--st-todo-fg); opacity: 1; }
.star.on .ic { fill: currentColor; }
.star-mark { display: inline-flex; color: var(--st-todo-fg); }
.star-mark .ic { width: 16px; height: 16px; fill: currentColor; }
.task-note { flex-basis: 100%; font-size: 15px; line-height: 1.5; color: var(--fg-soft); white-space: pre-line; overflow-wrap: anywhere; }
.pcard .ptasks { font-size: 15.5px; color: var(--fg-soft); }
.pcard-head { display: flex; align-items: flex-start; gap: 8px; }
.pcard-head h3 { flex: 1; min-width: 0; }

/* ---------- 習慣打卡 ---------- */
.habit { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.habit-top { display: flex; align-items: center; gap: 12px; }
.habit .chk { width: 42px; height: 42px; }
.habit .chk .ic { width: 24px; height: 24px; }
.habit.done-today .chk { background: var(--accent); }
.habit.done-today .chk .ic { opacity: 1; }
.habit-meta { flex: 1; min-width: 0; }
.habit-meta h3 { margin: 0; font-size: 21px; font-weight: 400; line-height: 1.4; overflow-wrap: anywhere; }
.habit-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; color: var(--fg-soft); font-size: 16px; }
.streak { display: inline-flex; align-items: center; gap: 4px; color: var(--accent-ink); }
.streak .ic { width: 18px; height: 18px; }
.week7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 2px; border: 0; border-radius: 12px; background: none; color: var(--fg-soft); font-size: 14px; line-height: 1.3; }
.wk i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.wk i .ic { width: 15px; height: 15px; stroke-width: 3; opacity: 0; }
.wk.on i { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.wk.on i .ic { opacity: 1; }
.wk.today span { color: var(--accent-ink); }
.task.habit-row.done .task-title { text-decoration: none; color: var(--fg); }

/* ---------- 今日狀態 ---------- */
.mood-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.scale-row { display: grid; gap: 6px; }
.scale-row .lbl { font-size: 16px; color: var(--fg-soft); }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale button { display: flex; flex-direction: column; align-items: center; padding: 6px 2px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); line-height: 1.25; }
.scale button b { font-size: 24px; font-weight: 400; }
.scale button small { font-size: 13.5px; color: var(--fg-soft); white-space: nowrap; }
.scale button:hover { border-color: var(--accent); }
.scale button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.scale button[aria-pressed="true"] small { color: inherit; }
.mood-card > input { padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); width: 100%; min-width: 0; }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.hrow { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 4px 12px; align-items: center; width: 100%; padding: 10px 0; border: 0; background: none; text-align: left; }
.hrow + .hrow { border-top: 1px dashed var(--line); }
.hdate { font-size: 17px; line-height: 1.3; }
.hdate small { display: block; font-size: 13.5px; color: var(--fg-soft); }
.hbars { display: grid; gap: 4px; }
.hb { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg-soft); }
.hb em { font-style: normal; width: 2.2em; flex: none; }
.hb .trk { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.hb .trk i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.hb.en .trk i { background: var(--st-chore-fg); }
.hb b { width: 1.2em; font-weight: 400; text-align: right; flex: none; }
.hnone { color: var(--fg-soft); font-size: 15px; opacity: .8; }
.hnote { grid-column: 2; font-size: 15px; color: var(--fg-soft); overflow-wrap: anywhere; }

/* ---------- 靈感收集箱 ---------- */
.idea { padding: 10px 0; display: grid; gap: 8px; }
.idea + .idea { border-top: 1px dashed var(--line); }
.idea-text { border: 0; background: none; text-align: left; padding: 0; white-space: pre-line; overflow-wrap: anywhere; }
.idea-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.idea-foot .when { color: var(--fg-soft); font-size: 14.5px; margin-right: auto; display: inline-flex; align-items: center; gap: 8px; }
.mini-btn { min-height: 36px; padding: 2px 14px; font-size: 15px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent-ink); }
.mini-btn:hover { background: var(--accent-soft); }

/* ---------- both 模式：日／夜顏色標記（接在原本的點與線後面，才能蓋過） ---------- */
.dot.rd { background: var(--day-c); opacity: 1; }
.dot.rn { background: var(--night-c); opacity: 1; }
.dot.d.rd, .dot.d.rn { opacity: .35; }
.line.p.rd, .mini-proj.rd { background: var(--day-bg); color: var(--day-fg); }
.line.p.rn, .mini-proj.rn { background: var(--night-bg); color: var(--night-fg); }
.line.t.rd { box-shadow: inset 3px 0 0 var(--day-c); padding-left: 9px; }
.line.t.rn { box-shadow: inset 3px 0 0 var(--night-c); padding-left: 9px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sw.rd { background: var(--day-c); }
.sw.rn { background: var(--night-c); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- creative manager ---------- */
.manager-panel { padding: 18px; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); display: grid; gap: 12px; min-width: 0; }
.manager-panel .actions { justify-content: flex-start; }
.manager-big { margin: 0; font-size: 26px; line-height: 1.4; }
.manager-panel .qadd .field { flex: 1; }
.manager-check { display: flex; align-items: flex-start; gap: 10px; font-size: 17px; overflow-wrap: anywhere; }
.manager-check input { width: 20px; height: 20px; flex: none; margin-top: 4px; accent-color: var(--accent); }
.manager-change { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
.manager-change .hint { white-space: pre-wrap; overflow-wrap: anywhere; }
.form details { overflow-wrap: anywhere; }
.form li + li { margin-top: 8px; }
button:disabled { opacity: .5; cursor: wait; }
</style>
</head>

<script>
(() => {
  'use strict';

  /* ---------- constants ---------- */
  const SVGNS = 'http://www.w3.org/2000/svg';
  const STATUS = [
    { key: 'doing',  label: '盛開中',   emoji: '🌹' },
    { key: 'todo',   label: '含苞待放', emoji: '🌷' },
    { key: 'paused', label: '風乾中',   emoji: '🍂' },
    { key: 'chore',  label: '修枝剪葉', emoji: '✂️' },
    { key: 'new',    label: '待播種',   emoji: '🪴' },
  ];
  const BY = Object.fromEntries(STATUS.map(s => [s.key, s]));
  const norm = k => (BY[k] ? k : 'new');
  const rank = k => STATUS.findIndex(s => s.key === norm(k));
  const WD = ['日', '一', '二', '三', '四', '五', '六'];
  const NAV = [
    { key: 'projects', label: '專案總覽',   icon: 'projects', grp: '計畫' },
    { key: 'today',    label: '今天',       icon: 'today' },
    { key: 'todo',     label: '待辦清單',   icon: 'list' },
    { key: 'week',     label: '週計畫',     icon: 'week' },
    { key: 'month',    label: '月計畫',     icon: 'month' },
    { key: 'studio',   label: '角色工作室', icon: 'projects', grp: '創作經紀人' },
    { key: 'cloud',    label: '雲端與經紀人', icon: 'data' },
    { key: 'habits',   label: '習慣打卡',   icon: 'habit', grp: '日常小幫手' },
    { key: 'mood',     label: '今日狀態',   icon: 'mood' },
    { key: 'inbox',    label: '靈感收集箱', icon: 'inbox' },
  ];
  const VIEWNAME = Object.fromEntries(NAV.map(n => [n.key, n.label]));
  // 朝（key: day）= 平常的事務；暮（key: night）= 角色、算圖等創作；朝暮（key: both）= 兩邊混在一起看。
  // key 是存在資料裡的內部代號，改顯示名稱時不用動資料。
  const REALM = { day: { label: '朝', short: '朝' }, night: { label: '暮', short: '暮' } };
  const MODES = [{ key: 'day', label: '朝' }, { key: 'night', label: '暮' }, { key: 'both', label: '朝暮' }];
  const MOOD_WORDS = ['很差', '不太好', '普通', '不錯', '很好'];
  const ENERGY_WORDS = ['沒電', '偏低', '普通', '充足', '滿格'];

  /* ---------- tiny helpers ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function icon(name) {
    const s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('class', 'ic');
    s.setAttribute('aria-hidden', 'true');
    const u = document.createElementNS(SVGNS, 'use');
    u.setAttribute('href', '#i-' + name);
    s.appendChild(u);
    return s;
  }
  function roseSvg(cls) {
    const s = document.createElementNS(SVGNS, 'svg');
    if (cls) s.setAttribute('class', cls);
    s.setAttribute('viewBox', '0 0 48 48');
    s.setAttribute('aria-hidden', 'true');
    const u = document.createElementNS(SVGNS, 'use');
    u.setAttribute('href', '#rose');
    s.appendChild(u);
    return s;
  }
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /* ---------- dates (all local time, 'YYYY-MM-DD') ---------- */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; };
  const todayStr = () => ymd(new Date());
  const fmtMD = s => { const d = parse(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
  const fmtShort = s => {
    const d = parse(s);
    const base = (d.getMonth() + 1) + '/' + d.getDate();
    return d.getFullYear() === new Date().getFullYear() ? base : d.getFullYear() + '/' + base;
  };

  /* ---------- settings ---------- */
  const Settings = { weekStart: 1 };
  { const v = lsGet('yousao.weekStart'); if (v === '0' || v === '1') Settings.weekStart = Number(v); }

  /* ---------- Store and explicit Google Drive adapter ---------- */
  const Store = window.YousaoStore.create({ uid, claude: window.claude });
  const Drive = window.YousaoDrive.create();

  /* ---------- app state ---------- */
  const App = {
    view: lsGet('yousao.view') || 'projects',
    mode: lsGet('yousao.mode') || 'day',           // day | night | both
    addRealm: lsGet('yousao.addRealm') === 'night' ? 'night' : 'day', // 「朝暮」模式下新增東西預設放哪一面
    anchor: todayStr(),
    filter: lsGet('yousao.filter') || 'all',
    onlyStar: false,
    showDone: false,
  };
  if (!VIEWNAME[App.view]) App.view = 'projects';
  if (!MODES.some(m => m.key === App.mode)) App.mode = 'day';
  if (App.filter !== 'all' && !BY[App.filter]) App.filter = 'all';
  let sheetState = null;
  let lastFocus = null;

  /* ---------- 朝／暮：換整頁配色 ---------- */
  const realmOf = r => (r && r.realm === 'night' ? 'night' : 'day');   // 沒標的舊資料一律算朝
  const inMode = r => App.mode === 'both' || realmOf(r) === App.mode;
  const newRealm = () => (App.mode === 'both' ? App.addRealm : App.mode);
  function applyTheme() {
    const root = document.documentElement;
    root.dataset.realm = App.mode;
    // 朝固定亮色玫瑰；暮固定靛藍（CSS 處理）；朝暮跟隨系統亮暗
    if (App.mode === 'day') root.dataset.theme = 'light'; else root.removeAttribute('data-theme');
    try {
      const sysDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
      const color = App.mode === 'night' ? '#141A33' : (App.mode === 'both' && sysDark) ? '#1C1315' : '#F6EBE8';
      const metas = document.querySelectorAll('meta[name="theme-color"]');
      metas.forEach((m, i) => { if (i) m.remove(); });
      let m = metas[0];
      if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
      m.removeAttribute('media');
      m.content = color;
    } catch (e) {}
  }
  applyTheme();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (App.mode === 'both') applyTheme(); }); } catch (e) {}

  /* ---------- schedule queries ---------- */
  function projectsOn(day) {
    return Store.list('projects').filter(p => {
      if (!inMode(p)) return false;
      const s = p.start || '', e = p.due || '';
      if (s && e) return s <= day && day <= e;
      if (e) return e === day;
      if (s) return s === day;
      return false;
    }).sort((a, b) => rank(a.status) - rank(b.status));
  }
  function projTag(p, day) {
    if (p.due && day === p.due) return '截止';
    if (p.start && day === p.start) return '開始';
    return '';
  }
  const byOrder = (a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || (b.star ? 1 : 0) - (a.star ? 1 : 0) || (a.createdAt || 0) - (b.createdAt || 0);
  function tasksOn(day) {
    return Store.list('tasks').filter(t => t.date === day && inMode(t)).sort(byOrder);
  }
  const openTasks = () => Store.list('tasks').filter(t => !t.done && inMode(t));

  /* ---------- habits ---------- */
  const habitsList = () => Store.list('habits').filter(h => !h.archived && inMode(h)).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  function checkIndex() {
    const m = new Map();
    Store.list('checks').forEach(c => { if (!m.has(c.habitId)) m.set(c.habitId, new Set()); m.get(c.habitId).add(c.date); });
    return m;
  }
  function streakOf(set) {
    if (!set) return 0;
    let d = new Date();
    if (!set.has(ymd(d))) d = addDays(d, -1);     // 今天還沒打也不算斷，到明天才算
    let n = 0;
    while (set.has(ymd(d))) { n++; d = addDays(d, -1); }
    return n;
  }
  function toggleCheck(h, date) {
    const id = h.id + '_' + date;
    if (Store.get('checks', id)) Store.del('checks', id); else Store.put('checks', { id, habitId: h.id, date });
  }

  /* ---------- mood / energy ---------- */
  function setMoodField(date, patch) {
    const cur = Store.get('moods', date) || { id: date, date, createdAt: Date.now() };
    const rec = { ...cur, ...patch };
    ['mood', 'energy'].forEach(k => { if (rec[k] == null) delete rec[k]; });
    if (!rec.note) delete rec.note;
    if (rec.mood == null && rec.energy == null && !rec.note) {
      if (Store.get('moods', date)) Store.del('moods', date);
      return;
    }
    Store.put('moods', rec);
  }
  function weekStartOf(dateStr) {
    const d = parse(dateStr);
    return addDays(d, -((d.getDay() - Settings.weekStart + 7) % 7));
  }
  function schedText(p) {
    const a = p.start ? fmtShort(p.start) : '', b = p.due ? fmtShort(p.due) : '';
    if (a && b) return a + ' → ' + b;
    if (b) return '截止 ' + b;
    if (a) return '開始 ' + a;
    return '';
  }

  /* ---------- keep typing through re-renders ---------- */
  function withKeep(fn) {
    const a = document.activeElement;
    const keep = a && a.dataset && a.dataset.keep !== undefined && a.id;
    const id = keep ? a.id : null, val = keep ? a.value : null;
    const ss = keep ? a.selectionStart : null;
    fn();
    if (id) {
      const n = document.getElementById(id);
      if (n && n.dataset.keep !== undefined) {
        n.value = val;
        n.focus({ preventScroll: true });
        try { n.setSelectionRange(ss, ss); } catch (e) {}
      }
    }
  }

  /* ---------- toast ---------- */
  let toastTimer = 0;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3600);
  }
  Store.onError(e => {
    const c = e && e.code;
    toast(c === 'quota_exceeded' ? '資料量已經到上限，請先刪掉一些。'
      : (c === 'invalid_argument' || c === 'not_granted') ? '沒有存成功：只有頁面主人可以修改。'
      : '沒有存成功，過幾秒再試一次。');
  });

  /* ---------- shared pieces ---------- */
  function secTitle(text, rightNode) {
    const h = el('h3', 'sec-title');
    h.appendChild(el('span', 'grow', text));
    if (rightNode) h.appendChild(rightNode);
    return h;
  }
  function armedDelete(btn, onConfirm) {
    const label = btn.textContent;
    btn.addEventListener('click', () => {
      if (btn.classList.contains('armed')) { onConfirm(); return; }
      btn.classList.add('armed');
      btn.textContent = '再按一次刪除';
      setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = label; } }, 3200);
    });
  }
  function toggleTask(t) {
    const rec = { ...t, done: !t.done };
    if (rec.done) rec.doneAt = Date.now(); else delete rec.doneAt;
    Store.put('tasks', rec);
  }
  function rtag(realm, mini) {
    const t = el('span', 'rtag ' + realm + (mini ? ' mini' : ''), mini ? REALM[realm].short : REALM[realm].label);
    if (mini) t.setAttribute('aria-label', REALM[realm].label);
    return t;
  }
  // 「朝暮」模式下，新增東西時用來選放在哪一面；單面模式不需要，回傳 null
  function realmToggle() {
    if (App.mode !== 'both') return null;
    const b = el('button', 'realm-toggle rtag ' + App.addRealm, REALM[App.addRealm].label);
    b.type = 'button';
    const sync = () => {
      b.className = 'realm-toggle rtag ' + App.addRealm;
      b.textContent = REALM[App.addRealm].label;
      b.setAttribute('aria-label', '新增到' + REALM[App.addRealm].label + '（按一下切換朝／暮）');
    };
    sync();
    b.addEventListener('click', () => {
      App.addRealm = App.addRealm === 'day' ? 'night' : 'day';
      lsSet('yousao.addRealm', App.addRealm);
      sync();
    });
    return { node: b, get: () => App.addRealm };
  }
  // 表單裡的「屬於朝／暮」選擇
  function realmField(initial, onChange) {
    let val = initial === 'night' ? 'night' : 'day';
    const w = el('div', 'field');
    w.appendChild(el('span', 'lbl', '屬於'));
    const seg = el('div', 'seg small');
    seg.setAttribute('role', 'radiogroup');
    seg.setAttribute('aria-label', '屬於朝或暮');
    const btns = ['day', 'night'].map(k => {
      const b = el('button', null, REALM[k].label);
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.dataset.m = k;
      b.addEventListener('click', () => { val = k; sync(); if (onChange) onChange(k); });
      seg.appendChild(b);
      return b;
    });
    const sync = () => btns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.m === val)));
    sync();
    w.appendChild(seg);
    return { node: w, get: () => val, set: v => { val = v === 'night' ? 'night' : 'day'; sync(); } };
  }
  function viewHead(title, sub) {
    const h = el('header', 'view-head');
    h.appendChild(el('h2', null, title));
    if (sub) h.appendChild(el('p', null, sub));
    return h;
  }

  function taskRow(t, opts = {}) {
    const row = el('div', 'task' + (t.done ? ' done' : ''));
    const chk = el('button', 'chk');
    chk.type = 'button';
    chk.setAttribute('role', 'checkbox');
    chk.setAttribute('aria-checked', String(!!t.done));
    chk.setAttribute('aria-label', (t.done ? '取消完成：' : '標為完成：') + t.title);
    chk.appendChild(icon('check'));
    chk.addEventListener('click', e => { e.stopPropagation(); toggleTask(t); });
    const body = el('button', 'task-body');
    body.type = 'button';
    body.appendChild(el('span', 'task-title', t.title));
    const p = t.projectId ? Store.get('projects', t.projectId) : null;
    if (p) body.appendChild(el('span', 'tag', p.title));
    if (t.minutes) body.appendChild(el('span', 'tag', t.minutes + ' 分鐘'));
    if (opts.showDate && t.date) body.appendChild(el('span', 'tag', fmtShort(t.date)));
    if (App.mode === 'both') body.appendChild(rtag(realmOf(t), opts.compact));
    if (!opts.star && t.star) { const m = el('span', 'star-mark'); m.setAttribute('aria-label', '重要'); m.appendChild(icon('star')); body.appendChild(m); }
    if (opts.showNote && t.note) body.appendChild(el('span', 'task-note', t.note));
    body.addEventListener('click', () => openTaskSheet(t.id));
    row.append(chk, body);
    if (opts.star) {
      const s = el('button', 'star' + (t.star ? ' on' : ''));
      s.type = 'button';
      s.setAttribute('aria-pressed', String(!!t.star));
      s.setAttribute('aria-label', (t.star ? '取消重要：' : '標為重要：') + t.title);
      s.appendChild(icon('star'));
      s.addEventListener('click', e => {
        e.stopPropagation();
        const rec = { ...t };
        if (t.star) delete rec.star; else rec.star = true;
        Store.put('tasks', rec);
      });
      row.appendChild(s);
    }
    if (opts.moveToToday) {
      const mv = el('button', 'task-move', opts.moveLabel || '移到今天');
      mv.type = 'button';
      mv.addEventListener('click', () => Store.put('tasks', { ...t, date: todayStr() }));
      row.appendChild(mv);
    }
    return row;
  }
  // date：固定日期（今天、某一天）；opts.withDate / withStar：待辦清單用，可以順手選日期和重要
  function addTaskForm(date, prefix, opts = {}) {
    const f = el('form', 'qadd');
    const inp = el('input');
    inp.id = prefix + '-input';
    inp.type = 'text';
    inp.maxLength = 120;
    inp.placeholder = '新增一件待辦…';
    inp.autocomplete = 'off';
    inp.setAttribute('aria-label', '新增待辦');
    inp.dataset.keep = '';
    const rt = realmToggle();
    const btn = el('button', 'btn primary', '加入');
    btn.type = 'submit';
    f.appendChild(inp);
    if (rt) f.appendChild(rt.node);
    f.appendChild(btn);
    let dateIn = null, starBtn = null, star = false;
    if (opts.withDate || opts.withStar) {
      const o = el('div', 'qopts');
      if (opts.withDate) {
        const lab = el('label', null, '日期（可不填）');
        dateIn = el('input');
        dateIn.type = 'date';
        dateIn.id = prefix + '-date';
        lab.htmlFor = dateIn.id;
        o.append(lab, dateIn);
      }
      if (opts.withStar) {
        starBtn = el('button', 'chip small', '★ 重要');
        starBtn.type = 'button';
        starBtn.setAttribute('aria-pressed', 'false');
        starBtn.addEventListener('click', () => { star = !star; starBtn.setAttribute('aria-pressed', String(star)); });
        o.appendChild(starBtn);
      }
      f.appendChild(o);
    }
    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = inp.value.trim();
      if (!v) return;
      const rec = { title: v, done: false, realm: rt ? rt.get() : newRealm(), createdAt: Date.now() };
      const dv = dateIn ? dateIn.value : date;
      if (dv) rec.date = dv;
      if (star) rec.star = true;
      inp.value = '';
      if (dateIn) dateIn.value = '';
      star = false;
      if (starBtn) starBtn.setAttribute('aria-pressed', 'false');
      Store.put('tasks', rec);
    });
    return f;
  }
  function projectLine(p, day) {
    const row = el('button', 'proj-row');
    row.type = 'button';
    const pill = el('span', 'pill static st-' + norm(p.status), BY[norm(p.status)].emoji + ' ' + BY[norm(p.status)].label);
    row.append(pill, el('span', 'ptitle', p.title));
    const tag = day ? projTag(p, day) : '';
    const when = tag || schedText(p);
    if (when) row.appendChild(el('span', 'tag', when));
    if (App.mode === 'both') row.appendChild(rtag(realmOf(p)));
    row.addEventListener('click', () => openProjectSheet(p.id));
    return row;
  }

  /* ---------- views ---------- */
  function viewProjects(main) {
    const everything = Store.list('projects');
    const items = everything.filter(inMode);

    const mast = el('header', 'masthead');
    const t = el('div', 'mast-title');
    t.append(roseSvg(), el('h2', 'mast-name', '酌有韶'));
    const last = items.map(p => p.updatedAt).filter(Boolean).sort().pop();
    mast.append(t, el('p', 'mast-sub', '最後更新：' + (last || '尚無紀錄') + '｜' +
      (Store.mode() === 'db' ? '有進度直接跟晏說，老公馬上幫妳更新（自己點也能改）' : '資料存在這支裝置裡，記得偶爾到選單裡備份')));
    main.appendChild(mast);

    const counts = Object.fromEntries(STATUS.map(s => [s.key, 0]));
    items.forEach(p => { counts[norm(p.status)]++; });
    const stats = el('section', 'stats');
    stats.setAttribute('aria-label', '專案數量');
    STATUS.forEach(s => {
      const d = el('div', 'stat');
      d.append(el('b', null, String(counts[s.key])), el('span', null, s.emoji + ' ' + s.label));
      stats.appendChild(d);
    });
    const all = el('div', 'stat');
    all.append(el('b', null, String(items.length)), el('span', null, '整座花園'));
    stats.appendChild(all);
    main.appendChild(stats);

    const bar = el('div', 'bar');
    bar.setAttribute('role', 'group');
    bar.setAttribute('aria-label', '狀態篩選');
    [{ key: 'all', label: '全部' }, ...STATUS.map(s => ({ key: s.key, label: s.emoji + ' ' + s.label }))].forEach(c => {
      const b = el('button', 'chip', c.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(App.filter === c.key));
      b.addEventListener('click', () => { App.filter = c.key; lsSet('yousao.filter', c.key); render(); });
      bar.appendChild(b);
    });
    const add = el('button', 'btn soft add', '＋ 新增專案');
    add.type = 'button';
    add.addEventListener('click', () => openProjectSheet(null));
    bar.appendChild(add);
    main.appendChild(bar);

    if (!items.length) {
      const e = el('div', 'empty');
      const other = everything.length - items.length;
      e.append(roseSvg(), el('h3', null, App.mode === 'day' ? '朝的花圃還是空的' : App.mode === 'night' ? '暮的花圃還是空的' : '花圃還是空的'),
        el('p', null, other
          ? '另一面已經有 ' + other + ' 個專案了，按上面的開關可以過去看，或在這裡種下第一朵。'
          : Store.mode() === 'db'
            ? '按上面的「＋ 新增專案」自己種下第一朵，或直接跟晏說，老公一次幫妳全部種好。'
            : '按上面的「＋ 新增專案」種下第一朵，也可以在選單裡開週計畫、月計畫。'));
      main.appendChild(e);
      return;
    }
    const shown = items
      .filter(p => App.filter === 'all' || norm(p.status) === App.filter)
      .sort((a, b) => rank(a.status) - rank(b.status) ||
        (a.due || '9999').localeCompare(b.due || '9999') ||
        String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
    if (!shown.length) {
      const e = el('div', 'empty');
      e.append(el('h3', null, '這個分類還沒有專案'), el('p', null, '換個分類看看，或按上面的「＋ 新增專案」。'));
      main.appendChild(e);
      return;
    }
    const grid = el('section', 'grid');
    shown.forEach(p => {
      const st = norm(p.status);
      const c = el('article', 'pcard');
      const head = el('div', 'pcard-head');
      head.appendChild(el('h3', null, p.title || '（未命名專案）'));
      if (App.mode === 'both') head.appendChild(rtag(realmOf(p)));
      c.appendChild(head);
      const when = schedText(p);
      if (when) c.appendChild(el('div', 'when', when));
      const pts = Store.list('tasks').filter(t => t.projectId === p.id);
      if (pts.length) c.appendChild(el('div', 'ptasks', '待辦 ' + pts.filter(t => t.done).length + '／' + pts.length));
      if (p.note) c.appendChild(el('p', null, p.note));
      const foot = el('div', 'pfoot');
      const pill = el('label', 'pill st-' + st);
      const sel = el('select');
      sel.setAttribute('aria-label', '變更狀態');
      STATUS.forEach(s => { const o = el('option', null, s.emoji + ' ' + s.label); o.value = s.key; o.selected = s.key === st; sel.appendChild(o); });
      sel.addEventListener('change', () => Store.put('projects', { ...p, status: sel.value, updatedAt: todayStr() }));
      pill.appendChild(sel);
      const edit = el('button', 'link-btn', '編輯');
      edit.type = 'button';
      edit.addEventListener('click', () => openProjectSheet(p.id));
      foot.append(pill, el('span', 'grow'), edit);
      c.appendChild(foot);
      grid.appendChild(c);
    });
    main.appendChild(grid);
  }

  /* ---------- habit & mood pieces (used by today + their own views) ---------- */
  function habitRow(h, set, ts) {
    const done = !!(set && set.has(ts));
    const row = el('div', 'task habit-row' + (done ? ' done' : ''));
    const chk = el('button', 'chk');
    chk.type = 'button';
    chk.setAttribute('role', 'checkbox');
    chk.setAttribute('aria-checked', String(done));
    chk.setAttribute('aria-label', (done ? '取消今天的打卡：' : '今天打卡：') + h.title);
    chk.appendChild(icon('check'));
    chk.addEventListener('click', () => toggleCheck(h, ts));
    const body = el('div', 'task-body');
    body.appendChild(el('span', 'task-title', h.title));

      ['mood', 'energy'].forEach(k => rows[k].forEach((b, i) => b.setAttribute('aria-pressed', String(cur[k] === i + 1))));

  /* ---------- sheets ---------- */
  function openSheet(node, state, focusSel) {
    const sheet = $('#sheet');
    const prev = sheetState;
    if (!prev) lastFocus = document.activeElement;
    sheet.replaceChildren(node);
    $('#sheet-wrap').hidden = false;
    document.body.classList.add('lock');
    // a form opened from a day sheet returns to that day when it closes
    const back = prev ? (prev.kind === 'day' ? prev.date : prev.returnTo || null) : null;
    sheetState = { ...(state || { kind: 'form' }), returnTo: back };
    sheet.scrollTop = 0;
    const target = focusSel ? sheet.querySelector(focusSel) : null;
    (target || sheet).focus({ preventScroll: true });
  }
  function closeSheet() {
    const back = sheetState && sheetState.returnTo;
    const lf = lastFocus;
    if (back) {
      sheetState = null;
      openDaySheet(back, false);
      lastFocus = lf;
      return;
    }
    $('#sheet-wrap').hidden = true;
    if (!drawer.classList.contains('open')) document.body.classList.remove('lock');
    sheetState = null;
    if (lf && lf.isConnected) { try { lf.focus({ preventScroll: true }); } catch (e) {} }
  }

    const wrap = el('div', 'form');

      try { await navigator.clipboard.writeText(out.value); toast('已複製'); }
      catch (e) { out.focus(); out.select(); toast('請長按選取後複製'); }
    });
    row.appendChild(copy);
    if (Store.mode() === 'local') {
      const dl = el('button', 'btn', '下載檔案'); dl.type = 'button';

          a.download = 'yousao-backup-' + todayStr() + '.json';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        } catch (e) { toast('這個瀏覽器不能直接下載，請改用複製'); }
      });
      row.appendChild(dl);
    }
    wrap.appendChild(row);

    wrap.appendChild(secTitle('匯入'));
    const inp = el('textarea', 'backup-box'); inp.id = 'b-in'; inp.placeholder = '把備份文字貼在這裡'; inp.setAttribute('aria-label', '要匯入的備份');

    });
    row2.append(el('span', 'grow'), close, go);
    wrap.appendChild(row2);
    openSheet(wrap, { kind: 'form' });
  }

      const d = el('details');
      d.appendChild(el('summary', null, '怎麼放到手機桌面'));
      d.appendChild(el('p', null, 'iPhone：用 Safari 開這個網址，按下方的分享圖示，選「加入主畫面」。Android：用 Chrome 開，按右上角選單，選「安裝應用程式」或「加到主畫面」。'));
      box.appendChild(d);
    }
    box.appendChild(el('p', 'mode-note', Store.mode() === 'db'
      ? '資料存在 Claude 雲端，電腦和手機會同步。'
      : '資料存在這支裝置裡。到「雲端與經紀人」手動上傳與下載。'));
    if (!Store.persistOk()) box.appendChild(el('p', 'mode-note', '注意：這個瀏覽器目前存不了資料（可能是無痕模式），關掉頁面資料就會消失。'));
    box.appendChild(el('p', 'credit', '字體：辰宇落雁體 Thin Monospaced v1.0（SIL OFL 1.1，網頁嵌入用的改名轉檔版）'));
  }

  /* ---------- top bar & render ---------- */
  function buildSeg() {
    const seg = $('#mode-seg');
    MODES.forEach(m => {
      const b = el('button', null, m.label);
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.dataset.m = m.key;
      b.addEventListener('click', () => setMode(m.key));
      seg.appendChild(b);
    });
  }
  function updateSeg() {
    $('#mode-seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.m === App.mode)));
  }
  function setMode(m) {
    if (m === App.mode) return;
    App.mode = m;
    lsSet('yousao.mode', m);
    applyTheme();
    updateSeg();
    render();
  }
  function renderTop() {
    updateSeg();
    $('#top-title').textContent = VIEWNAME[App.view];
    const box = $('#top-actions');
    box.replaceChildren();
    if (App.view === 'week' || App.view === 'month') {
      const b = el('button', 'text-btn', '今天'); b.type = 'button';
      b.addEventListener('click', () => { App.anchor = todayStr(); render(); });
      box.appendChild(b);
    }
  }
  // 手指按著的時候先不重畫整頁（雲端同步的回音若剛好這時進來，會把按鈕換掉、這一下就點空了）。
  // 放開後等 click 跑完再補畫；沒有 click（拖曳、長按）就最多等 450ms。
  let pressAt = 0, renderQueued = false, releaseTimer = 0;
  const pressing = () => pressAt && Date.now() - pressAt < 1000;
  const released = () => { pressAt = 0; if (renderQueued) { renderQueued = false; render(); } };
  const releaseIn = ms => { clearTimeout(releaseTimer); releaseTimer = setTimeout(released, ms); };
  document.addEventListener('pointerdown', () => { pressAt = Date.now(); clearTimeout(releaseTimer); }, true);
  document.addEventListener('pointerup', () => releaseIn(450), true);
  document.addEventListener('pointercancel', () => releaseIn(0), true);
  document.addEventListener('click', () => releaseIn(0), true);
  function render() {
    if (pressing()) {
      if (!renderQueued) { renderQueued = true; setTimeout(() => { if (renderQueued) { renderQueued = false; render(); } }, 1050); }
      return;
    }
    withKeep(() => {
      renderTop();
      updateNav();
      const main = $('#main');
      main.classList.toggle('wide', App.view === 'week');
      main.replaceChildren();
      VIEWS[App.view](main);
    });
    if (sheetState && sheetState.kind === 'day') refreshDaySheet();
    if (!Store.persistOk() && !render.warned) { render.warned = true; renderDrawerSec(); toast('這個瀏覽器存不了資料，關掉頁面就會消失'); }
  }

  /* ---------- wiring ---------- */
  menuBtn.addEventListener('click', openDrawer);
  $('#drawer-close').addEventListener('click', () => closeDrawer());
  scrim.addEventListener('click', () => closeDrawer());
  $('#sheet-wrap').addEventListener('mousedown', e => { if (e.target.id === 'sheet-wrap') closeSheet(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (sheetState) closeSheet(); else if (drawer.classList.contains('open')) closeDrawer();
  });

  function registerSW() {
    if (!('serviceWorker' in navigator) || window.claude || !/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  }

  // 隔天回到畫面時，「今天」要跟著換
  let dayKey = todayStr();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const t = todayStr();
    if (t !== dayKey) { dayKey = t; App.anchor = t; }
    render();
  });

  buildSeg();
  buildNav();
  updateNav();
  Store.init().then(() => {
    Store.onChange(render);
    renderDrawerSec();
    render();
    registerSW();
  });
})();

</script>
</body>
</html>
